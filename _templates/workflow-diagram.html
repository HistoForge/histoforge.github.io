<svg class="workflow-diagram" viewBox="0 0 1024 1024" role="img" aria-labelledby="recipe-diagram-title recipe-diagram-description" xmlns="http://www.w3.org/2000/svg">
  <title id="recipe-diagram-title">Combine models and scripts</title>
  <desc id="recipe-diagram-description">Three example recipes. Leydig nucleus and cell models feed a measurement script. Tubule and lumen models feed a script that selects tubule cross-sections, followed by tubule measurements. Spermatogenesis uses the same tubule preparation, then runs a cell model inside selected cross-sections and counts cells per tubule. These are research examples, not a visual workflow editor or a list of available modules.</desc>
